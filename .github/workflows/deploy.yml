name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permette l'avvio manuale dalla tab Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # Hostinger richiede FTP over TLS (esplicito, porta 21)
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Hostinger chiude la control socket se resta idle durante la scansione:
          # alziamo il timeout a 2 min per evitare "Timeout (control socket)".
          timeout: 120000
          # PULIZIA UNA-TANTUM: la docroot conteneva file vecchi + una cartella
          # public_html/ annidata (deploy finiti nel percorso sbagliato). Azzeriamo
          # tutto e ricarichiamo pulito. RIMUOVERE dopo il primo deploy riuscito.
          dangerous-clean-slate: true
          # Sync incrementale: carica solo i file cambiati e rimuove dal server
          # quelli eliminati da dist/, mantenendo public_html identico al build.
          # Sincronizza solo le differenze: usa un manifest .ftp-deploy-sync-state.json
          # sul server per caricare solo i file cambiati ad ogni deploy.
